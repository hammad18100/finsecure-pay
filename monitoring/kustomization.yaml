apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - namespace.yaml
  - prometheus.yaml
  - alertmanager.yaml
  - exporters.yaml
  - loki.yaml
  - fluent-bit.yaml
  - grafana.yaml
configMapGenerator:
  - name: grafana-dashboards
    files:
      - finsecure-pay.json
generatorOptions:
  disableNameSuffixHash: true
