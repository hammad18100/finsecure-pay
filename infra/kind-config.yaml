kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: finsecure
containerdConfigPatches:
- |-
  [plugins."io.containerd.grpc.v1.cri".registry]
    config_path = "/etc/containerd/certs.d"
nodes:
- role: control-plane
  extraPortMappings:
  - containerPort: 30080
    hostPort: 30080
  - containerPort: 30030
    hostPort: 30030
  - containerPort: 30090
    hostPort: 30090
