spring.application.name=finsecure-pay
server.port=8080

app.version=${APP_VERSION:1.0.0}

validation.max-amount=${VALIDATION_MAX_AMOUNT:10000}
validation.allowed-currencies=${VALIDATION_ALLOWED_CURRENCIES:USD,EUR,GBP,AED}

management.endpoints.web.exposure.include=health,prometheus,info
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=finsecure-pay
